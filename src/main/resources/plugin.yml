name: FreshFishing
version: '${project.version}'
main: ru.deelter.freshFishing.FreshFishing
api-version: '1.21'
authors: [ DeelTer ]
website: https://t.me/deelter
softdepend:
  - Vault
  - VaultUnlocked
  # Emote triggers: players bind an emote to "caught a fish" / "fished up an item".
  - BetterEmotes
  # Screen effects: speed lines on grapple, screen shake from boss fish.
  - BetterEffects
  - MiniPlaceholders

commands:
  fish:
    description: Open fish sale menu, view catch records or reload config
    usage: /fish menu [player] | /fish top [5|10|15|reset] | /fish reload
  sandmarker:
    description: Manage sand loot markers
    usage: /sandmarker <create|list|remove>
    permission: freshfishing.admin

permissions:
  freshfishing.admin:
    description: Allows managing sand loot markers, reloading config and resetting the fishing leaderboard
    default: op