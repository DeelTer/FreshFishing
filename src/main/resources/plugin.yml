name: FreshFishing
version: '2.0'
main: ru.deelter.freshFishing.FreshFishing
api-version: '1.21'
authors: [ DeelTer ]
website: https://t.me/deelter
softdepend:
  - Vault
  - VaultUnlocked

commands:
  fish:
    description: Open fish sale menu or reload config
    usage: /fish menu [player] | /fish reload
  sandmarker:
    description: Manage sand loot markers
    usage: /sandmarker <create|list|remove>
    permission: freshfishing.admin

permissions:
  freshfishing.admin:
    description: Allows managing sand loot markers
    default: op