# --- PROBABILITY MECHANICS ---
# `blocks` represent the relative chance (weight) of an outcome.
# Total probability pool = sum of all blocks.
# Higher blocks = higher chance.

# --- BIOME RESTRICTIONS ---
# Players can only fish in allowed biomes.
# If list is empty → no restriction.
# Leave warning empty to disable the action bar message.
fish-only-in-biomes:
  warning: "<color:#EC5954>Only in oceans and rivers!</color>"
  list:
    - "RIVER"
    - "FROZEN_RIVER"
    - "OCEAN"
    - "FROZEN_OCEAN"
    - "WARM_OCEAN"
    - "DEEP_OCEAN"
    - "DEEP_LUKEWARM_OCEAN"
    - "DEEP_FROZEN_OCEAN"
    - "DEEP_COLD_OCEAN"
    - "COLD_OCEAN"
    - "LUKEWARM_OCEAN"

# --- HUNGER SYSTEM ---
# Consumes hunger points when fishing.
# Set to 0 to disable.
hunger:
  min-level-for-fishing: 3   # Minimum hunger level required to fish
  fish: 1                    # Hunger cost when catching a fish
  item: 0                    # Hunger cost when catching other items (e.g. junk)

# --- ITEM LORE FOR FISH ---
# Placeholders: <size> (fish size in cm), <rarity> (colored name)
# Use MiniMessage format: https://webui.advntr.dev/
item-lore:
  - ""
  - "<color:#CBFF61>Size:</color> <color:#EBF5D8><size>cm</color>"
  - "<color:#CBFF61>Rarity:</color> <rarity>"

# --- FISH RARITIES ---
# Each rarity has a display name (MiniMessage), weight (blocks), and size multiplier.
rarities:
  default:
    name: "<color:#D5D5D5>Default</color>"
    blocks: 100
    multiplier: 1.0
  rare:
    name: "<color:#EC5954>Rare</color>"
    blocks: 25
    multiplier: 1.2
  unique:
    name: "<color:#FA81CA>Unique</color>"
    blocks: 12
    multiplier: 1.3
  legendary:
    name: "<color:#FFD700>Legendary</color>"
    blocks: 2
    multiplier: 1.4
  mystery:
    name: "<color:#8B79FF>Mystic</color>"
    blocks: 1
    multiplier: 1.5

# --- FISH SIZE TIERS ---
# Each tier defines a size range (in cm), weight (blocks), and lambda.
# Lambda controls exponential distribution: higher lambda = sizes closer to min.
sizes:
  tier1:
    min: 6.0
    max: 16.0
    blocks: 120
    lambda: 4
  tier2:
    min: 16.1
    max: 36.0
    blocks: 40
    lambda: 4
  tier3:
    min: 36.1
    max: 54.0
    blocks: 22
    lambda: 4
  tier4:
    min: 54.1
    max: 140.0
    blocks: 12
    lambda: 4
  tier5:
    min: 140.1
    max: 600.0
    blocks: 20
    lambda: 20

# --- RANDOM ENTITIES FROM FISHING ---
# Instead of a fish, you may catch other entities.
# Keys are EntityType names (https://jd.papermc.io/paper/1.21.11/org/bukkit/entity/EntityType.html)
# Values are weight (blocks).
entities:
  COD: 65
  SALMON: 60
  TROPICAL_FISH: 55
  PUFFERFISH: 15
  SQUID: 8
  TURTLE: 8
  DROWNED: 6
  SKELETON: 5
  CREEPER: 1
  GUARDIAN: 3
  ELDER_GUARDIAN: 1

# --- VECTOR FOR THROWN ENTITIES ---
# Controls how caught entities fly toward the player.
# Default values are balanced; change only if you understand.
vector-caught-object:
  multiply: 1.4
  x: 0
  y: 0.4
  z: 0