# Minimum food level required to fish (0-20)
# Player cannot fish if food level is below this value
min-level-for-fishing: 3
# Hunger points consumed when catching a FISH entity
# Set to 0 to disable hunger cost for fish
fish: 1
# Hunger points consumed when catching non-fish items (junk, treasure)
# Set to 0 to disable hunger cost for items
item: 0

# Fish durability
fish-consume-damage: 20

# ==============================================
# ITEM LORE FOR FISH
# ==============================================
# Custom lore lines added to fish items when caught.
# Placeholders:
#   <size>  - Fish size in centimeters (e.g., "25.5")
#   <rarity> - Colored rarity name from rarities section
# Supports MiniMessage format: https://webui.advntr.dev/
# Leave list empty to disable lore entirely.
item-lore:
  - ""
  - "<color:#CBFF61>Size:</color> <color:#EBF5D8><size>cm</color>"
  - "<color:#CBFF61>Rarity:</color> <rarity>"

# ==============================================
# FISH RARITIES
# ==============================================
# Each rarity defines how rare and valuable a fish is.
# Properties:
#   name       - Display name (MiniMessage format, supports colors & gradients)
#   blocks     - Weight for probability selection (higher = more common)
#   multiplier - Price and scale multiplier (higher = more expensive/larger)
rarities:
  default:
    name: "<color:#D5D5D5>Default</color>"
    blocks: 165
    multiplier: 1.0
  rare:
    name: "<color:#EC5954>Rare</color>"
    blocks: 90
    multiplier: 1.4
  unique:
    name: "<color:#FA81CA>Unique</color>"
    blocks: 40
    multiplier: 1.8
  legendary:
    name: "<color:#FFD700>Legendary</color>"
    blocks: 15
    multiplier: 2.0
  mystery:
    name: "<color:#8B79FF>Mystic</color>"
    blocks: 1
    multiplier: 4.0

# ==============================================
# FISH SIZE TIERS
# ==============================================
# Each tier defines a size range and distribution for fish.
# Properties:
#   min    - Minimum size in centimeters (inclusive)
#   max    - Maximum size in centimeters (inclusive)
#   blocks - Weight for probability selection (higher = more common)
#   lambda - Exponential distribution parameter
#            Higher lambda = sizes cluster near the minimum
#            Lower lambda = more uniform distribution across the range
sizes:
  tier1:
    min: 6.0
    max: 16.0
    blocks: 120
    lambda: 5
  tier2:
    min: 16.1
    max: 36.0
    blocks: 80
    lambda: 4
  tier3:
    min: 36.1
    max: 54.0
    blocks: 40
    lambda: 4
  tier4:
    min: 54.1
    max: 140.0
    blocks: 30
    lambda: 4
  tier5:
    min: 140.1
    max: 600.0
    blocks: 20
    lambda: 20

# ==============================================
# NATURAL FISH SPAWN POOLS
# ==============================================
# Controls which size tiers and rarities naturally spawned fish can have.
# If a list is empty, falls back to the full pool (same as fishing).
# Tier IDs must match keys under "sizes" above (e.g. tier1, tier2).
# Rarity IDs must match keys under "rarities" above (e.g. default, rare).
natural-fish:
  allowed-sizes:
    - tier1
    - tier2
  allowed-rarities:
    - default
    - rare
# ==============================================
# RANDOM ENTITIES FROM FISHING
# ==============================================
# Instead of catching a fish, players may catch other entities.
# Keys are EntityType names (case-insensitive)
# Values are weight (blocks) for probability selection.
# Full entity list: https://jd.papermc.io/paper/1.21.11/org/bukkit/entity/EntityType.html
entities:
  COD: 75
  SALMON: 60
  TROPICAL_FISH: 55
  PUFFERFISH: 20
  NAUTILUS: 10
  ZOMBIE_NAUTILUS: 5
  SQUID: 8
  TURTLE: 8
  DROWNED: 6
  SKELETON: 5
  CREEPER: 1
  GUARDIAN: 3
  ELDER_GUARDIAN: 1

# ==============================================
# VECTOR FOR THROWN ENTITIES
# ==============================================
# Controls how caught entities fly toward the player.
# Properties:
#   multiply - Overall velocity multiplier (higher = faster flight)
#   x, y, z  - Additional velocity components added after normalization
# Default values are balanced; change only if you understand physics.
vector-caught-object:
  multiply: 1.4
  x: 0
  y: 0.4
  z: 0

# ==============================================
# SALE SHOP
# ==============================================
# GUI menu where players can sell fish and other caught items.
sale-shop:
  # Enable or disable the sale shop feature
  enabled: true
  # GUI title (supports MiniMessage format)
  title: "Fish Market"
  # GUI size in slots (must be multiple of 9, min 9, max 54)
  size: 27
  # Slot position for the "Sell" button (0-based index)
  sale-button-slot: 22
  sale-sound: "custom.coins.drop.multiply"
  # Price ranges for fish by rarity
  # If a rarity is not listed, uses default values
  # Price = min-price + (max-price - min-price) * (size / max-possible-size)
  # Then multiplied by rarity's multiplier
  fish-sale-ranges:
    default:
      min-price: 4
      max-price: 50
    rare:
      min-price: 30
      max-price: 100
    unique:
      min-price: 50
      max-price: 180
    legendary:
      min-price: 70
      max-price: 300
    mystery:
      min-price: 150
      max-price: 350
    # Add more rarities as needed:
    # unique:
    #   min-price: 50
    #   max-price: 1200
    # legendary:
    #   min-price: 150
    #   max-price: 3000
    # mystery:
    #   min-price: 500
    #   max-price: 10000
  # Custom prices for non-fish items (junk, treasure)
  # If an item type is not listed, uses default price of 0.15
